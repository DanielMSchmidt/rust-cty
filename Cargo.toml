[workspace]
# Own workspace: this repo is independent of the terraform-rewrite workbench it sits inside.

[package]
name = "cty"
version = "0.1.0"
description = "A Rust implementation of go-cty's value and type system"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/DanielMSchmidt/rust-cty"
# Not published. Consumers depend on this by git URL; see docs/repo-layout.md in the
# terraform-rewrite workbench.
publish = false

[dependencies]

[dev-dependencies]

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
# Stub phase: every fn body is todo!(), so parameters go unused. Remove once
# implementations land.
unused_variables = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
todo = "allow"
unimplemented = "allow"

[profile.bench]
debug = true

# Conformance test targets: one per upstream go-cty test area, declared
# explicitly so each compiles independently (cargo auto-discovers only tests/*.rs).
[[test]]
name = "conformance_types"
path = "tests/conformance/types.rs"

