[package]
name = "cty-derive"
version = "0.1.0"
description = "Derive macros for cty's interop traits (IntoCty, FromCty, CtyTyped)"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/DanielMSchmidt/rust-cty"
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
todo = "allow"
unimplemented = "allow"
