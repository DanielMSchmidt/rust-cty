[workspace]
# Own workspace: this repo is independent of the terraform-rewrite workbench it sits inside.
members = ["cty-derive"]

[package]
name = "cty"
version = "0.1.0"
description = "A Rust implementation of go-cty's value and type system"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/DanielMSchmidt/rust-cty"
# Not published. Consumers depend on this by git URL; see docs/repo-layout.md in the
# terraform-rewrite workbench.
publish = false

[dependencies]
thiserror = "2.0.20"
unicode-normalization = "0.1.25"

[dev-dependencies]
# Stub derives for the interop traits, used only by the conformance tests until
# the real derive implementations land; see cty-derive/src/lib.rs.
cty-derive = { path = "cty-derive" }

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
# Stub phase: every fn body is todo!(), so parameters go unused. Remove once
# implementations land.
unused_variables = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
todo = "allow"
unimplemented = "allow"

[profile.bench]
debug = true
